# Fleet inventory for `npm run fleet` (copy to fleet.yml, or point FLEET_CONFIG at it).
#
# A host is a Linux box with Docker, the NVIDIA toolkit and the compose projects checked
# out. The controller runs `docker compose` *on the host* over ssh (`ssh` is `user@host`
# or an alias from the controller's ~/.ssh/config; key auth, no prompts), and reads
# `nvidia-smi` the same way. Nothing is installed on the host. `context` (a docker
# context) is only for a host whose compose files the controller can read itself.
#
# A service is one or more compose services on one host, pinned to one GPU. `vramMb` is
# what it holds once up (for vLLM that is whatever --gpu-memory-utilization asks for, not
# a measurement). `priority` decides who leaves when the card is contended: lower goes
# first, and only after `idleUnloadSec` without demand. `url` is how transynth reaches
# the service; while it is up and healthy the controller writes it into
# Settings → Services as a managed row.

pollSec: 15

hosts:
  - name: gaming-pc
    ssh: valerii@192.168.50.140
    gpus:
      - { index: 0, name: RTX 5090, vramMb: 32607 }
    allow: [llm, embed, tts, asr, separate, tools]

  # The pipeline host itself: no GPU in the fleet (its services stay configured by env),
  # only the CPU-side bethesda-tools. The controller runs here and reaches the host over
  # ssh like any other (root's key in its own authorized_keys, host key in known_hosts).
  - name: pipeline
    ssh: root@192.168.50.161
    gpus: []
    allow: [tools]

services:
  # vLLM Gemma 4 26B-A4B at --gpu-memory-utilization 0.90: ~29.3 GB, nothing fits beside it.
  # The project keeps several compose files; `files` lists every one to load (compose
  # reads only the files named once `-f` is used), relative to `dir`.
  - name: gemma
    kinds: [llm]
    host: gaming-pc
    gpu: 0
    compose:
      dir: /home/valerii/Source/fallout4-localization-project
      files: [docker-compose.ai-translate.yml]
      services: [vllm-gemma-4-26b-a4b]
    url: http://192.168.50.140:8011
    maxParallel: 4
    vramMb: 29400
    priority: 10
    idleUnloadSec: 300
    startTimeoutSec: 600

  # Fish Speech is an engine (`vllm`, --gpu-memory-utilization 0.72) plus a gateway
  # (`server`, depends on the engine being healthy). Measured 2026-10-22: 25.5 GB together.
  - name: fish-speech
    kinds: [tts]
    host: gaming-pc
    gpu: 0
    compose:
      dir: /home/valerii/Source/xtts-dataset-builder
      services: [vllm, server]
    url: http://192.168.50.140:8080
    maxParallel: 2
    vramMb: 25600
    priority: 5
    idleUnloadSec: 300
    startTimeoutSec: 900

  # audio-intel ≥ 2.2 with SEPARATE_ENABLED=1 serves both asr and separate.
  - name: audio-intel
    kinds: [asr, separate]
    host: gaming-pc
    gpu: 0
    compose:
      dir: /home/valerii/Source/audio-intel
      services: [audio-intel]
    url: http://192.168.50.140:8090
    maxParallel: 2
    # Measured 2026-10-22: 7.7 GB resident (two large-v3 copies), 12.1 GB peak while separating.
    vramMb: 12500
    priority: 7
    idleUnloadSec: 600
    startTimeoutSec: 600

  # bethesda-tools (FaceFX LIP, xWMA under Wine) is CPU-only: no `gpu`, no VRAM, so it
  # contends with nothing and `keep: true` holds it up whether or not a job needs it. Nothing
  # declares `tools` as demand (voice jobs call it as an extra), so without `keep` the
  # controller would never start it. One entry per instance; the `tools` pool spreads calls
  # over every healthy one, next to the instance configured by env on the pipeline host.
  - name: bethesda-tools
    kinds: [tools]
    host: gaming-pc
    keep: true
    compose:
      dir: /home/valerii/bethesda-tools
      services: [bethesda-tools]
    url: http://192.168.50.140:3211
    maxParallel: 8
    priority: 1
    startTimeoutSec: 300

  # bethesda-tools on the pipeline host is part of the transynth compose project (profile
  # embedded-bethesda-tools, not in COMPOSE_PROFILES any more): naming the service enables
  # its profile, so the fleet is the only thing that starts it.
  - name: bethesda-tools-pipeline
    kinds: [tools]
    host: pipeline
    keep: true
    compose:
      dir: /root/Source/transynth
      services: [bethesda-tools]
    url: http://192.168.50.161:8015
    maxParallel: 8
    priority: 1
    startTimeoutSec: 300
