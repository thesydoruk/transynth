# Opt in via COMPOSE_PROFILES=embedded-audio-intel (see .env.example).
# Production with an external Whisper server leaves this unset.
#
# Needs the NVIDIA Container Toolkit. First start downloads the model.
# Host: http://localhost:8014 — GET /health, POST /v1/audio/transcriptions.
# From web/worker: DOCKER_AUDIO_INTEL_BASE_URL=http://audio-intel:9000
#
# STT only: no diarization, word timestamps, API key, or usage pings.
# Sharing a GPU with vllm-gemma: set AUDIO_INTEL_GPU_DEVICE to another card.

services:
  audio-intel:
    profiles: [embedded-audio-intel]
    image: ${AUDIO_INTEL_IMAGE:-hwdsl2/whisper-server:cuda}
    dns:
      - 8.8.8.8
      - 1.1.1.1
    ports:
      - '8014:9000'
    volumes:
      - ../data/whisper:/var/lib/whisper
    environment:
      WHISPER_MODEL: ${AUDIO_INTEL_WHISPER_MODEL:-large-v3-turbo}
      WHISPER_LANGUAGE: en
      WHISPER_DEVICE: ${AUDIO_INTEL_WHISPER_DEVICE:-cuda}
      WHISPER_COMPUTE_TYPE: ${AUDIO_INTEL_WHISPER_COMPUTE:-float16}
      WHISPER_PORT: '9000'
      WHISPER_API_KEY: ''
      WHISPER_DIARIZATION: 'false'
      WHISPER_WORD_TIMESTAMPS: 'false'
      WHISPER_DISABLE_USAGE_COUNTS: '1'
      WHISPER_MAX_UPLOAD_MB: '32'
      WHISPER_LOG_LEVEL: INFO
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['${AUDIO_INTEL_GPU_DEVICE:-0}']
              capabilities: [gpu]
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD',
          'python3',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9000/health', timeout=5).read()",
        ]
      interval: 15s
      timeout: 8s
      retries: 40
      start_period: 600s
