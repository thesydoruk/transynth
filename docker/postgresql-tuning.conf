# PostgreSQL tuning for bulk mod import and large editor queries.
# Applied by docker-compose.db.yml via `postgres -c …` overrides.
#
# For a local (non-Docker) install, merge these into postgresql.conf and reload.

# Connections
max_connections = 200

# Memory — larger sort/hash windows for big SELECTs; more cache for hot pages
shared_buffers = 512MB
work_mem = 64MB
maintenance_work_mem = 512MB
effective_cache_size = 1536MB
temp_buffers = 32MB

# WAL / checkpoints — smoother bulk INSERT throughput
wal_buffers = 64MB
min_wal_size = 512MB
max_wal_size = 4GB
checkpoint_completion_target = 0.9

# SSD-oriented planner defaults
random_page_cost = 1.1
effective_io_concurrency = 256

# Parallel query for large scans/aggregations
max_worker_processes = 8
max_parallel_workers = 8
max_parallel_workers_per_gather = 4

# Richer stats on large string/record tables
default_statistics_target = 200

# Docker-friendly
huge_pages = off
