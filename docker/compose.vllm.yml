# Opt in via COMPOSE_PROFILES=embedded-vllm (see .env.example).
# Production with an external chat pool leaves this unset.
#
# Needs the NVIDIA Container Toolkit. First start downloads tens of GB.
# Host: http://localhost:8011/v1 — Gemma 4 26B A4B IT (`gemma4:26b-a4b`).
# From web/worker: DOCKER_VLLM_BASE_URL=http://vllm-gemma:8000
#
# Blackwell: VLLM_OPENAI_IMAGE=vllm/vllm-openai:gemma4-0505-cu130
# Sharing a GPU with tei-embed: lower VLLM_GPU_MEMORY_UTILIZATION (e.g. 0.82).

services:
  vllm-gemma:
    profiles: [embedded-vllm]
    image: ${VLLM_OPENAI_IMAGE:-vllm/vllm-openai:gemma4-0505-cu129}
    dns:
      - 8.8.8.8
      - 1.1.1.1
    shm_size: '8gb'
    ipc: host
    ports:
      - '8011:8000'
    volumes:
      - ../data/huggingface:/root/.cache/huggingface
      - ../data/vllm-gemma-4-26b-a4b:/root/.cache/vllm
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      HF_HOME: /root/.cache/huggingface
      CUDA_VISIBLE_DEVICES: '0'
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['${LLM_GPU_DEVICE:-0}']
              capabilities: [gpu]
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD',
          'python3',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=12).read()",
        ]
      interval: 10s
      timeout: 25s
      retries: 8
      start_period: 300s
    command:
      - ${VLLM_GEMMA4_MODEL:-cyankiwi/gemma-4-26B-A4B-it-AWQ-4bit}
      - --quantization
      - compressed-tensors
      - --served-model-name
      - gemma4:26b-a4b
      - --max-num-batched-tokens
      - '4096'
      - --max-model-len
      - '200000'
      - --gpu-memory-utilization
      - '${VLLM_GPU_MEMORY_UTILIZATION:-0.94}'
      - --max-num-seqs
      - '12'
      - --cpu-offload-gb
      - '0'
      - --mm-processor-cache-gb
      - '0'
      - --tool-call-parser
      - gemma4
      - --enable-auto-tool-choice
      - --host
      - 0.0.0.0
      - --port
      - '8000'
