# Default stack: embedded Postgres (profile `embedded-db`) + web + worker + Redis.
# Copy `.env.example` (sets COMPOSE_PROFILES=embedded-db) then:
#
#   docker compose up -d --build
#   docker compose run --rm web npm run db:init
#   docker compose --profile tools run --rm cli npm run tools:install
#
# External Postgres (production): omit COMPOSE_PROFILES and DOCKER_DATABASE_URL.
# Point DATABASE_URL at your server. Start only app services:
#
#   docker compose up -d web worker redis
#
# External TTS: set TTS_BASE_URL in .env (not in this compose).
# Optional Whisper (Disco spoken-span): add `embedded-audio-intel`
# (docker/compose.audio-intel.yml). External audio-intel: set
# AUDIO_INTEL_BASE_URL and omit the profile.
# Optional Gemma chat / RAG embed: add `embedded-vllm` and/or `embedded-embed`
# (docker/compose.vllm.yml, docker/compose.embed.yml). External pools omit both.
# Optional FaceFX / xWMA: add `embedded-bethesda-tools`
# (docker/compose.bethesda-tools.yml). External sidecar: set BETHESDA_TOOLS_URL.
# Put TLS/reverse proxy in front of WEB_PORT. See SECURITY.md.

include:
  - docker/compose.db.yml
  - docker/compose.vllm.yml
  - docker/compose.embed.yml
  - docker/compose.audio-intel.yml
  - docker/compose.bethesda-tools.yml

services:
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: ${TRANSYNTH_IMAGE:-transynth}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    # Node as PID 1 never reaps orphaned ffmpeg grandchildren.
    init: true
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATA_DIR: /app/data
      PORT: ${PORT:-3000}
      # Container must listen on all interfaces so `ports:` can reach it.
      # Host `.env` HOST is for local `npm`/`tsx` (default 127.0.0.1).
      HOST: '0.0.0.0'
      DATABASE_URL: ${DOCKER_DATABASE_URL:-${DATABASE_URL}}
      LOG_LEVEL: ${LOG_LEVEL:-warn}
      VLLM_BASE_URL: ${DOCKER_VLLM_BASE_URL:-${VLLM_BASE_URL:-http://host.docker.internal:8000}}
      VLLM_EMBED_BASE_URL: ${DOCKER_VLLM_EMBED_BASE_URL:-${VLLM_EMBED_BASE_URL:-}}
      AUDIO_INTEL_BASE_URL: ${DOCKER_AUDIO_INTEL_BASE_URL:-${AUDIO_INTEL_BASE_URL:-http://host.docker.internal:8080}}
      BETHESDA_TOOLS_URL: ${DOCKER_BETHESDA_TOOLS_URL:-${BETHESDA_TOOLS_URL:-}}
      REDIS_URL: redis://redis:6379
    volumes:
      - ./data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - '${WEB_PORT:-${PORT:-3000}}:${PORT:-3000}'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:'+(process.env.PORT||3000)+'/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: ${WEB_MEMORY_LIMIT:-2g}

  # Background job worker — one BullMQ queue per resource in one process: `cpu`
  # (imports / TM apply), serial `llm`, `tts`, `asr`, `separate`. WORKER_QUEUES
  # narrows a worker to some of them (a second worker next to a GPU host).
  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: ${TRANSYNTH_IMAGE:-transynth}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    # Node as PID 1 never reaps orphaned ffmpeg grandchildren.
    init: true
    command: ['npm', '--prefix', 'worker', 'start']
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATA_DIR: /app/data
      DATABASE_URL: ${DOCKER_DATABASE_URL:-${DATABASE_URL}}
      LOG_LEVEL: ${LOG_LEVEL:-warn}
      VLLM_BASE_URL: ${DOCKER_VLLM_BASE_URL:-${VLLM_BASE_URL:-http://host.docker.internal:8000}}
      VLLM_EMBED_BASE_URL: ${DOCKER_VLLM_EMBED_BASE_URL:-${VLLM_EMBED_BASE_URL:-}}
      AUDIO_INTEL_BASE_URL: ${DOCKER_AUDIO_INTEL_BASE_URL:-${AUDIO_INTEL_BASE_URL:-http://host.docker.internal:8080}}
      BETHESDA_TOOLS_URL: ${DOCKER_BETHESDA_TOOLS_URL:-${BETHESDA_TOOLS_URL:-}}
      REDIS_URL: redis://redis:6379
      JOB_CONCURRENCY: ${JOB_CONCURRENCY:-8}
      NODE_OPTIONS: ${NODE_OPTIONS:---expose-gc}
    volumes:
      - ./data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    deploy:
      resources:
        limits:
          memory: ${WORKER_MEMORY_LIMIT:-8g}

  # BullMQ queue + job progress/snapshots. AOF keeps queued jobs across restarts.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5

  # Fleet controller (profile `fleet`): starts and stops GPU services on the hosts in
  # fleet.yml by queue demand, running `docker compose` on each host over ssh. Mount the
  # inventory and an ssh dir (key, known_hosts, optional config) for the hosts' `ssh`
  # targets; the docker config mount only matters for a host reached by docker context.
  fleet:
    profiles: [fleet]
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: ${TRANSYNTH_IMAGE:-transynth}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    init: true
    command: ['npm', 'run', 'fleet']
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATA_DIR: /app/data
      DATABASE_URL: ${DOCKER_DATABASE_URL:-${DATABASE_URL}}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      REDIS_URL: redis://redis:6379
      FLEET_CONFIG: /app/fleet.yml
    volumes:
      - ./data:/app/data
      - ./fleet.yml:/app/fleet.yml:ro
      - ${FLEET_SSH_DIR:-./data/fleet-ssh}:/root/.ssh:ro
      - ${FLEET_DOCKER_CONFIG:-./data/fleet-docker}:/root/.docker
    depends_on:
      redis:
        condition: service_healthy

  # One-shot jobs (translate, scan:mods, …). Not started by `docker compose up`.
  cli:
    profiles: [tools]
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: ${TRANSYNTH_IMAGE:-transynth}:${IMAGE_TAG:-latest}
    init: true
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATA_DIR: /app/data
      DATABASE_URL: ${DOCKER_DATABASE_URL:-${DATABASE_URL}}
      VLLM_BASE_URL: ${DOCKER_VLLM_BASE_URL:-${VLLM_BASE_URL:-http://host.docker.internal:8000}}
      VLLM_EMBED_BASE_URL: ${DOCKER_VLLM_EMBED_BASE_URL:-${VLLM_EMBED_BASE_URL:-}}
      AUDIO_INTEL_BASE_URL: ${DOCKER_AUDIO_INTEL_BASE_URL:-${AUDIO_INTEL_BASE_URL:-http://host.docker.internal:8080}}
      BETHESDA_TOOLS_URL: ${DOCKER_BETHESDA_TOOLS_URL:-${BETHESDA_TOOLS_URL:-}}
    volumes:
      - ./data:/app/data
    # depends_on:
    #   db:
    #     condition: service_healthy
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    entrypoint: ['node', '--import', 'tsx/esm']

volumes:
  redis-data:
