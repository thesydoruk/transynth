services:
  # PostgreSQL
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    volumes:
      - pgdata:/var/lib/postgresql/data
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-localizer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-localizer}
      POSTGRES_DB: ${POSTGRES_DB:-localizer}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-localizer}"]
      interval: 5s
      timeout: 3s
      retries: 5

  # One-shot CLI runner — pass command as: docker compose run --rm cli npm run translate -- <args>
  cli:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-localizer}:${POSTGRES_PASSWORD:-localizer}@db:5432/${POSTGRES_DB:-localizer}
    depends_on:
      db:
        condition: service_healthy
    network_mode: host   # reaches Ollama on the host at localhost:11434

  # Interactive dev shell with live source mount
  dev:
    build: .
    volumes:
      - .:/app
      - /app/node_modules       # keep container node_modules
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-localizer}:${POSTGRES_PASSWORD:-localizer}@db:5432/${POSTGRES_DB:-localizer}
    depends_on:
      db:
        condition: service_healthy
    network_mode: host
    stdin_open: true
    tty: true
    entrypoint: ["bash"]

  # Web UI server — serves Fastify API + built React SPA on port 3000
  web:
    build: .
    command: ["node", "--import", "tsx/esm", "src/web/server.ts"]
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-localizer}:${POSTGRES_PASSWORD:-localizer}@db:5432/${POSTGRES_DB:-localizer}
      PORT: "3000"
    depends_on:
      db:
        condition: service_healthy
    network_mode: host   # reaches Ollama on the host at localhost:11434

  # Optional: run Ollama inside Docker (GPU passthrough — Linux only)
  # Uncomment if you want Ollama containerized alongside the CLI.
  #
  # ollama:
  #   image: ollama/ollama:latest
  #   volumes:
  #     - ollama_models:/root/.ollama
  #   ports:
  #     - "11434:11434"
  #   deploy:
  #     resources:
  #       reservations:
  #         devices:
  #           - driver: nvidia
  #             count: all
  #             capabilities: [gpu]

volumes:
  pgdata:
