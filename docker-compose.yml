# Production stack: PostgreSQL (docker-compose.db.yml) + web API/SPA.
#
#   docker compose up -d --build
#   docker compose run --rm web npm run db:init
#   docker compose --profile tools run --rm cli npm run translate -- …
#
# Put TLS/reverse proxy in front of WEB_PORT (default 3000). Set strong credentials in .env.

include:
  - docker-compose.db.yml

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: transynth:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-localizer}:${POSTGRES_PASSWORD:-localizer}@db:5432/${POSTGRES_DB:-localizer}
      PORT: '3000'
      LOG_LEVEL: ${LOG_LEVEL:-warn}
      MULTI_USER: ${MULTI_USER:-true}
      VLLM_BASE_URL: ${VLLM_BASE_URL:-http://host.docker.internal:8000}
    volumes:
      - ./logs:/app/logs
      - ./uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '${WEB_PORT:-3000}:3000'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: ${WEB_MEMORY_LIMIT:-2g}

  # One-shot jobs (translate, scan:mods, …). Not started by `docker compose up`.
  cli:
    profiles: [tools]
    build:
      context: .
      dockerfile: Dockerfile
    image: transynth:${IMAGE_TAG:-latest}
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-localizer}:${POSTGRES_PASSWORD:-localizer}@db:5432/${POSTGRES_DB:-localizer}
      VLLM_BASE_URL: ${VLLM_BASE_URL:-http://host.docker.internal:8000}
    depends_on:
      db:
        condition: service_healthy
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    entrypoint: ['node', '--import', 'tsx/esm']
