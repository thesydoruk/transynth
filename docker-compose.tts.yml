# Optional TTS Generation WebUI (https://github.com/rsxdalv/TTS-WebUI).
#
#   docker compose --profile tts up -d
#   docker compose --profile tts logs -f tts-webui
#
# React UI: http://localhost:${TTS_UI_PORT:-3771}
# Gradio API: http://localhost:${TTS_PORT:-7770}
# OpenAI-compatible API: http://localhost:${TTS_OPENAI_API_PORT:-7778}
#
# First run downloads models — watch logs until ready.
# For GPU acceleration, uncomment the deploy.resources block below (requires NVIDIA Container Toolkit).

services:
  tts-webui:
    profiles: [tts]
    image: ghcr.io/rsxdalv/tts-webui:main
    container_name: tts-webui
    restart: unless-stopped
    ports:
      - '${TTS_PORT:-7770}:7770'
      - '${TTS_UI_PORT:-3771}:3000'
      - '${TTS_OPENAI_API_PORT:-7778}:7778'
    volumes:
      - ./data/tts-webui/data:/app/tts-webui/data
      - ./data/tts-webui/outputs:/app/tts-webui/outputs
      - ./data/tts-webui/favorites:/app/tts-webui/favorites
    environment:
      # Allow running when host CUDA version does not match the image requirement.
      NVIDIA_DISABLE_REQUIRE: 1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['${TTS_GPU_DEVICE_ID:-0}']
              capabilities: [gpu]
