services:
  db:
    image: postgres:18-alpine

    restart: unless-stopped

    # Default Docker /dev/shm (64 MB) is too small for shared_buffers + parallel workers.
    shm_size: '1gb'

    volumes:
      # PG 18+ stores cluster data under /var/lib/postgresql/<major>/docker
      - ./data/postgres:/var/lib/postgresql

    env_file:
      - .env

    environment:
      POSTGRES_USER: localizer
      POSTGRES_PASSWORD: localizer
      POSTGRES_DB: localizer

    ports:
      - '5433:5432'

    # See docker/postgresql-tuning.conf for rationale and non-Docker installs.
    command:
      - postgres
      - -c
      - max_connections=200
      - -c
      - shared_buffers=512MB
      - -c
      - work_mem=64MB
      - -c
      - maintenance_work_mem=512MB
      - -c
      - effective_cache_size=1536MB
      - -c
      - temp_buffers=32MB
      - -c
      - wal_buffers=64MB
      - -c
      - min_wal_size=512MB
      - -c
      - max_wal_size=4GB
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=256
      - -c
      - max_worker_processes=8
      - -c
      - max_parallel_workers=8
      - -c
      - max_parallel_workers_per_gather=4
      - -c
      - default_statistics_target=200
      - -c
      - huge_pages=off

    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U localizer']

      interval: 5s

      timeout: 3s

      retries: 5
