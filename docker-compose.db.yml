services:
  db:
    image: postgres:17-alpine

    restart: unless-stopped

    volumes:
      - ./data/postgres:/var/lib/postgresql/data

    env_file:
      - .env

    environment:
      POSTGRES_USER: ${POSTGRES_USER:-localizer}

      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-localizer}

      POSTGRES_DB: ${POSTGRES_DB:-localizer}

    ports:
      - '5432:5432'

    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-localizer}']

      interval: 5s

      timeout: 3s

      retries: 5
