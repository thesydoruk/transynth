services:
  db:
    image: postgres:18-alpine

    restart: unless-stopped

    volumes:
      # PG 18+ stores cluster data under /var/lib/postgresql/<major>/docker
      - ./data/postgres:/var/lib/postgresql

    env_file:
      - .env

    environment:
      POSTGRES_USER: localizer
      POSTGRES_PASSWORD: localizer
      POSTGRES_DB: localizer

    ports:
      - '5433:5432'

    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U localizer']

      interval: 5s

      timeout: 3s

      retries: 5
