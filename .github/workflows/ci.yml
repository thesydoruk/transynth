name: CI

# Pull requests run the checks. Every green commit on main also publishes
# ghcr.io/<owner>/transynth:<commit sha>; the production host picks that
# image up with scripts/deploy.sh (see doc/deployment.md).
#
# A merge whose tree is exactly the tree a green pull-request run already
# tested skips the checks on main and goes straight to the image, so a merge
# reaches the host in the time one image build takes.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # On main: did a pull-request run already pass on exactly this tree? A merge
  # commit of an up-to-date branch has the same tree as the branch head, and
  # that head's PR run is the proof. A diverged merge (tree differs) or a direct
  # push gets the full checks.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tested: ${{ steps.probe.outputs.tested }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'push'
        with:
          fetch-depth: 2

      - name: Look for a green pull-request run on this tree
        id: probe
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tested=false
          head_tree="$(git rev-parse 'HEAD^{tree}')"
          pr_head="$(git rev-parse -q --verify 'HEAD^2' || true)"
          if [ -n "$pr_head" ] && [ "$(git rev-parse "$pr_head^{tree}")" = "$head_tree" ]; then
            run="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow CI --event pull_request \
                     --commit "$pr_head" --status success --limit 1 --json databaseId \
                     -q '.[0].databaseId')"
            if [ -n "$run" ]; then
              tested=true
              echo "tree $head_tree already passed in run $run (PR head $pr_head)"
            fi
          fi
          echo "tested=$tested" >> "$GITHUB_OUTPUT"

  # Format, lint, types, and the web UI's own tests and build.
  check:
    needs: gate
    if: github.event_name != 'push' || needs.gate.outputs.tested != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web-ui/package-lock.json
            worker/package-lock.json

      - name: Install root dependencies
        run: npm ci
        env:
          HUSKY: '0'

      - name: Install web-ui dependencies
        run: npm --prefix web-ui ci

      - name: Install worker dependencies
        run: npm --prefix worker ci
        env:
          HUSKY: '0'

      - name: Prettier
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run build

      - name: web-ui tests
        run: npm --prefix web-ui test

      - name: web-ui build
        run: npm run web:build

  # Unit tests on their own runner, two Jest workers (the memory limit per
  # worker keeps the ESM runtime bounded; one worker is only for small boxes).
  tests:
    needs: gate
    if: github.event_name != 'push' || needs.gate.outputs.tested != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FFMPEG_RELEASE: autobuild-2026-10-21-13-06
      FFMPEG_BUILD: ffmpeg-n8.1.3-20-gc8de997cb1
      FFMPEG_BRANCH: '8.1'
      FFMPEG_SHA256: 35168ba5f8edfa264eb2e2e3071d1b9d67d88ae667b665b284cb4be7f68ab23c
    steps:
      - uses: actions/checkout@v4

      # Speaker-reference tests cut real WAVs, as the runtime image does. A pinned
      # static build from GitHub releases, kept in the Actions cache: apt on the
      # runner has stalled for 14 minutes on a slow mirror (2026-10-22).
      - name: Restore ffmpeg
        id: ffmpeg
        uses: actions/cache@v4
        with:
          path: ~/.local/ffmpeg
          key: ffmpeg-${{ env.FFMPEG_BUILD }}-linux64
      - name: Install ffmpeg
        if: steps.ffmpeg.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/ffmpeg.tar.xz"
          curl -fsSL --retry 3 -o "$archive"             "https://github.com/BtbN/FFmpeg-Builds/releases/download/$FFMPEG_RELEASE/$FFMPEG_BUILD-linux64-gpl-$FFMPEG_BRANCH.tar.xz"
          echo "$FFMPEG_SHA256  $archive" | sha256sum -c -
          mkdir -p ~/.local/ffmpeg
          tar -xJf "$archive" --strip-components=2 -C ~/.local/ffmpeg             "$FFMPEG_BUILD-linux64-gpl-$FFMPEG_BRANCH/bin/ffmpeg"
      - run: |
          echo "$HOME/.local/ffmpeg" >> "$GITHUB_PATH"
          ~/.local/ffmpeg/ffmpeg -version | head -1

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            worker/package-lock.json

      - name: Install root dependencies
        run: npm ci
        env:
          HUSKY: '0'

      - name: Install worker dependencies
        run: npm --prefix worker ci
        env:
          HUSKY: '0'

      - name: Tests
        run: npm test -- --maxWorkers=2

  # SQL against a real Postgres: the same pgvector image production runs.
  database:
    needs: gate
    if: github.event_name != 'push' || needs.gate.outputs.tested != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: transynth
          POSTGRES_PASSWORD: transynth
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U transynth"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://transynth:transynth@localhost:5432/transynth_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install root dependencies
        run: npm ci
        env:
          HUSKY: '0'

      - name: Database tests
        run: npm run test:db

  # The web UI on a desktop, tablets and phones down to 320px, in Chromium
  # and WebKit. The API is faked, so this needs only the web-ui install.
  # The job runs in Playwright's own image, which ships the browsers: the
  # download from Playwright's CDN took 15-20 minutes on some days. Keep the
  # image tag at web-ui's @playwright/test version. Two shards halve the wall time.
  devices:
    needs: gate
    if: github.event_name != 'push' || needs.gate.outputs.tested != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web-ui/package-lock.json

      - name: Install web-ui dependencies
        run: npm --prefix web-ui ci

      - name: Device tests (shard ${{ matrix.shard }} of 2)
        run: npm --prefix web-ui run test:devices -- --shard=${{ matrix.shard }}/2

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: device-test-report-${{ matrix.shard }}
          path: web-ui/playwright-report
          retention-days: 7

  # Published for every green main commit; skipped checks (already-tested
  # tree) count as green, a failed or cancelled one does not.
  image:
    needs: [gate, check, tests, database, devices]
    if: >-
      always()
      && github.event_name != 'pull_request'
      && github.ref == 'refs/heads/main'
      && needs.gate.result == 'success'
      && !contains(needs.*.result, 'failure')
      && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    env:
      APP_IMAGE: ghcr.io/${{ github.repository }}
      TOOLS_IMAGE: ghcr.io/${{ github.repository }}-bethesda-tools
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The Wine sidecar is slow to build and slow to restart, so it is only
      # republished when its sources change (or it has never been published).
      - name: Did bethesda-tools change?
        id: tools
        run: |
          before='${{ github.event.before }}'
          if ! docker manifest inspect "$TOOLS_IMAGE:latest" >/dev/null 2>&1 \
            || [ '${{ github.event_name }}' != push ] \
            || ! git cat-file -e "$before^{commit}" 2>/dev/null \
            || ! git diff --quiet "$before" "$GITHUB_SHA" -- services/bethesda-tools; then
            echo build=true >> "$GITHUB_OUTPUT"
          fi

      - name: Publish bethesda-tools image
        if: steps.tools.outputs.build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: services/bethesda-tools
          push: true
          tags: |
            ${{ env.TOOLS_IMAGE }}:latest
            ${{ env.TOOLS_IMAGE }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=bethesda-tools
          cache-to: type=gha,mode=max,scope=bethesda-tools

      # Published last: deploy.sh treats this tag as "CI is done for <sha>".
      - name: Publish transynth image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ${{ env.APP_IMAGE }}:latest
            ${{ env.APP_IMAGE }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=transynth
          cache-to: type=gha,mode=max,scope=transynth
